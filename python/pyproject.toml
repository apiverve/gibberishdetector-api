[project]
name = "apiverve-gibberishdetector"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Gibberish Detector analyzes text using bigram frequency and vowel ratios to identify nonsensical or randomly generated content."
keywords = ["gibberish detector", "text validation", "spam detection", "nonsense detector", "text quality"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/gibberishdetector?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/gibberishdetector?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/gibberishdetector-api"
Twitter = "https://twitter.com/apivervehq"
